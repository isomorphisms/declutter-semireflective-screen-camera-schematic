name: Photo review browser
on:
  push:
    branches: [work/inspectable-cleanup]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify qualified source and generated synthetic fixture
        run: sha256sum --check evidence/photo-review-v1/qualified-material.sha256
      - name: Provision browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/photo-review" --no-save playwright@1.56.1
      - name: Provision Chromium
        run: node "$RUNNER_TEMP/photo-review/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise offline review and saved-session recovery
        env:
          PHOTO_REVIEW_NODE_MODULES: ${{ runner.temp }}/photo-review/node_modules
        run: node examples/autogenerated/schematic-cleanup/browser/PhotoReviewBrowserTests.mjs examples/autogenerated/schematic-cleanup/fixtures/photo-review-synthetic.html examples/autogenerated/schematic-cleanup/fixtures/photo-review-upload.png "$RUNNER_TEMP/photo-review-checks"
      - name: Upload synthetic-only browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-review-browser-evidence
          path: ${{ runner.temp }}/photo-review-checks
          if-no-files-found: error
