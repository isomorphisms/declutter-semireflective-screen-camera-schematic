name: Source-preserving paper mesh
on:
  push:
    branches: [work/inspectable-cleanup]
    paths:
      - 'examples/autogenerated/schematic-cleanup/Paper*.idric'
      - '.github/workflows/paper-mesh.yml'
  pull_request:
    paths:
      - 'examples/autogenerated/schematic-cleanup/Paper*.idric'
      - '.github/workflows/paper-mesh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-idric:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build canonical pinned Idric and private Chez runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paper-evidence"
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libgmp-dev libncurses-dev zlib1g-dev liblz4-dev curl
          git clone https://github.com/isomorphisms/Idric.git "$RUNNER_TEMP/Idric"
          git -C "$RUNNER_TEMP/Idric" checkout --detach 2bce7677f513d711875e978bd6f5ad28b9e54d58
          test "$(git -C "$RUNNER_TEMP/Idric" rev-parse HEAD)" = 2bce7677f513d711875e978bd6f5ad28b9e54d58
          JOBS=2 "$RUNNER_TEMP/Idric/edric" bootstrap > "$RUNNER_TEMP/paper-evidence/bootstrap.log" 2>&1
      - name: Compile and execute new and existing raster checks
        shell: bash
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/Idric"
          export CHEZ="$compiler/_/.tools/bin/scheme"
          export PATH="$compiler/_/.tools/bin:$PATH"
          export IDRIS2_PREFIX="$compiler/_/bootstrap-build"
          export IDRIS2_PACKAGE_PATH="$compiler/_/bootstrap-build/idris2-0.8.0"
          export IDRIS2_LIBS="$compiler/_/build/exec/idris2_app"
          source="$GITHUB_WORKSPACE/examples/autogenerated/schematic-cleanup"
          mkdir -p "$RUNNER_TEMP/paper-exec"
          for module in PaperMesh PaperReplay PaperMeshTests RasterTests RegistrationTests; do
            "$compiler/_/build/exec/idris2" --source-dir "$source" \
              --build-dir "$RUNNER_TEMP/build-$module" --output-dir "$RUNNER_TEMP/paper-exec" \
              --cg chez -o "$module" "$source/$module.idric" \
              > "$RUNNER_TEMP/paper-evidence/$module-build.log" 2>&1
            test -x "$RUNNER_TEMP/paper-exec/$module"
          done
          for module in PaperMeshTests RasterTests RegistrationTests; do
            mkdir "$RUNNER_TEMP/fixtures-$module"
            "$RUNNER_TEMP/paper-exec/$module" "$RUNNER_TEMP/fixtures-$module" \
              | tee "$RUNNER_TEMP/paper-evidence/$module.log"
          done
          git rev-parse HEAD > "$RUNNER_TEMP/paper-evidence/source-head.txt"
          sha256sum "$source"/Paper*.idric > "$RUNNER_TEMP/paper-evidence/source.sha256"
      - name: Package executable and compiler for private offline photograph execution
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/paper-evidence/paper-exec.tar.gz" paper-exec
          tar -C "$RUNNER_TEMP/Idric" -czf "$RUNNER_TEMP/paper-evidence/idric-runtime.tar.gz" \
            _/.tools _/bootstrap-build _/build/exec
          git archive HEAD | gzip > "$RUNNER_TEMP/paper-evidence/project-source.tar.gz"
          sha256sum "$RUNNER_TEMP/paper-evidence/"*.tar.gz > "$RUNNER_TEMP/paper-evidence/artifacts.sha256"
      - name: Retain synthetic qualification and offline runtime only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-mesh-qualification
          path: ${{ runner.temp }}/paper-evidence
          if-no-files-found: error
          retention-days: 14
