name: Paper-photo mosaic reference
on:
  push:
    branches: [work/paper-projective-mesh]
  pull_request:
    paths:
      - 'experiments/paper-stitch/**'
      - '.github/workflows/paper-stitch-reference.yml'
permissions:
  contents: read
jobs:
  synthetic-source-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile and test with synthetic P6 imagery only
        run: sh experiments/paper-stitch/check.sh
